
name: Build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build plugins
        run: |
          chmod +x ./gradlew
          ./gradlew make makePluginsJson

      - name: Prepare repository files
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/cloudstream-publish"
          mkdir -p "$publish_dir"

          find . -type f -path '*/build/*.cs3' \
            -exec cp {} "$publish_dir/" \;

          test -f build/plugins.json
          cp build/plugins.json "$publish_dir/plugins.json"

          if ! find "$publish_dir" -maxdepth 1 \
            -type f -name '*.cs3' -print -quit | grep -q .; then
            echo "No .cs3 plugin file was generated."
            exit 1
          fi

          cat > "$publish_dir/repo.json" <<EOF
          {
            "name": "CloudStream Plugins",
            "description": "Personal CloudStream plugin repository",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"
            ]
          }
          EOF

      - name: Publish builds branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cloudstream-publish"

          git init -b builds
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Build ${GITHUB_SHA}"

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin builds
